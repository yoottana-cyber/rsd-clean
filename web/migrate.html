<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ย้ายข้อมูล RSD Clean → D1</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:20px;background:#f1fbfc;color:#17324a}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #d8eaee}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccdce1;width:100%;margin:7px 0}button{background:#0789a1;color:#fff;border:0;cursor:pointer}.warn{background:#fff8e1;padding:12px;border-radius:10px}.ok{white-space:pre-wrap;background:#eefbf2;padding:12px;border-radius:10px}</style></head><body><div class="card"><h1>ย้ายข้อมูล Google Sheet → Cloudflare D1</h1><p>ใช้ไฟล์ <b>RSD-Clean-D1-export.json</b> ที่สร้างจาก Apps Script เดิม</p><div class="warn">ไฟล์นี้มีข้อมูลบัญชีแบบ hash ห้ามเผยแพร่ต่อสาธารณะ และหลังย้ายเสร็จควรลบไฟล์ export ออกจากเครื่อง/Drive</div><label>ไฟล์ Export</label><input id="file" type="file" accept="application/json,.json"><label>Migration Secret</label><input id="secret" type="password" autocomplete="off"><label><input id="replace" type="checkbox" style="width:auto"> แทนที่ข้อมูล D1 เดิมทั้งหมด</label><button id="go">เริ่มย้ายข้อมูล</button><div id="out"></div></div><script>go.onclick=async()=>{out.textContent='';const f=file.files[0];if(!f)return alert('เลือกไฟล์ export');try{go.disabled=true;out.textContent='กำลังนำเข้า...';const bundle=JSON.parse(await f.text());const r=await fetch('/migrate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:secret.value,bundle,replace:replace.checked})});const j=await r.json();if(!j.ok)throw Error(j.error);out.className='ok';out.textContent='สำเร็จ\n'+JSON.stringify(j.data,null,2);}catch(e){out.className='warn';out.textContent=e.message}finally{go.disabled=false}};</script></body></html>
