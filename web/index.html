<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light">
  <meta name="description" content="RSD Clean ระบบตรวจความสะอาดและให้คะแนนเขตพื้นที่ โรงเรียนรัษฎา">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RSD Clean">
  <title>RSD Clean • โรงเรียนรัษฎา</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="https://www.ratsada.ac.th/learn/up/uploads/NOOK/LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#home" class="brand" aria-label="RSD Clean โรงเรียนรัษฎา">
      <span class="school-logo-wrap">
        <img class="school-logo" src="https://www.ratsada.ac.th/learn/up/uploads/NOOK/LOGO.png" alt="ตราโรงเรียนรัษฎา" onerror="this.onerror=null;this.src='/icon-192.png'">
      </span>
      <span class="brand-copy">
        <strong>RSD Clean</strong>
        <small>โรงเรียนรัษฎา · พื้นที่สะอาด สร้างได้ทุกวัน</small>
      </span>
    </a>
    <button id="hamburger" class="icon-btn mobile-menu-trigger" aria-label="เปิดเมนู" aria-expanded="false"><i data-lucide="menu"></i></button>
    <nav id="nav" aria-label="เมนูหลัก"></nav>
    <div id="account" class="account-area"></div>
  </header>

  <main id="app" class="app-main" aria-live="polite"></main>

  <footer class="app-footer">
    <img src="https://www.ratsada.ac.th/learn/up/uploads/NOOK/LOGO.png" alt="" onerror="this.style.display='none'">
    <span>RSD Clean · โรงเรียนรัษฎา</span>
    <small>School Cleanliness Inspection & Gamification System</small>
  </footer>

  <div id="network-status" class="network-status hidden" role="status" aria-live="polite">ออฟไลน์ · ระบบจะเชื่อมต่อใหม่อัตโนมัติเมื่อมีอินเทอร์เน็ต</div>

  <div id="modal" class="modal-backdrop hidden">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-btn" aria-label="ปิดหน้าต่าง"><i data-lucide="x"></i></button>
      </div>
      <div id="modal-body"></div>
    </section>
  </div>

  <div id="loading" class="loading hidden" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <p id="loading-text">กำลังประมวลผล…</p>
    </div>
  </div>

  <script src="/core.js"></script>
</body>
</html>
